<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal AI</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e3e3df; --accent: #2f5d50; --accent-text: #ffffff; --user: #e8efe9; --warn: #8a5a00; --warn-bg: #fff6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161716; --surface: #1f201f; --text: #ececea; --muted: #9a9a95;
      --border: #333431; --accent: #7fb8a4; --accent-text: #10201b; --user: #26332e; --warn: #f0c060; --warn-bg: #2d2610;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 0 12px; }
  h1 { font-size: 1.1rem; margin: 0; }
  header button { background: none; border: none; color: var(--muted); cursor: pointer; font: inherit; font-size: .9rem; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 90%; }
  .user { align-self: flex-end; background: var(--user); }
  .bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .bot.stopped { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .meta { font-size: .8rem; color: var(--muted); margin-top: 6px; white-space: normal; }
  .empty { color: var(--muted); text-align: center; margin: auto 0; }
  form { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 20px; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 12px; border-radius: 12px;
             border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send { padding: 0 18px; border: none; border-radius: 12px; background: var(--accent);
                color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: progress; }
  label { font-size: .85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Personal AI</h1>
    <button type="button" id="reset">New chat</button>
  </header>
  <section id="log" aria-live="polite"><p class="empty" id="empty">Ask anything. I use a calculator for maths and web search for current facts.</p></section>
  <form id="form">
    <div class="row">
      <textarea id="msg" placeholder="Message" rows="1" required maxlength="4000" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </div>
    <label><input type="checkbox" id="escalate"> Think harder (Nemotron Ultra)</label>
  </form>
</main>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("msg");
const send = document.getElementById("send");
const escalate = document.getElementById("escalate");

function add(text, cls) {
  document.getElementById("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  div.scrollIntoView({ block: "end" });
  return div;
}

function meta(data) {
  const parts = data.tool_calls.map(c => `${c.name} ${c.status === "ok" ? "✓" : "(" + c.status + ")"}`);
  const model = data.model ? data.model.split("/").pop() : data.tier;
  parts.push(`${data.tokens.toLocaleString()} tokens`, model);
  const p = document.createElement("div");
  p.className = "meta";
  p.textContent = parts.join(" · ");
  return p;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add(message, "user");
  input.value = "";
  send.disabled = true;
  const pending = add("Thinking…", "bot");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, escalate: escalate.checked }),
    });
    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    pending.textContent = data.answer;
    if (data.stop_reason !== "done") pending.classList.add("stopped");
    pending.appendChild(meta(data));
  } catch (err) {
    pending.textContent = `Something went wrong: ${err.message}`;
    pending.classList.add("stopped");
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById("reset").addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  log.innerHTML = '<p class="empty" id="empty">New chat started.</p>';
});
</script>
</body>
</html>
